name: Release

# Cut a versioned release by hand (Actions → Release → Run workflow, or `gh workflow run Release -f version=1.0.0`):
# the full CI pipeline runs first; then both images are built with the version, scanned, given an SBOM, pushed to
# GitHub Container Registry, signed with cosign (keyless), and the tag v<version> is published as a GitHub release.
# Deploying a release to staging or production follows docs/19-deployment-and-rollback.md.
on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version, semantic (1.0.0, or 1.0.0-rc.1 for a pre-release)'
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with: { fetch-depth: 0 }
      - name: Check the version, the branch and the tag
        env: { VERSION: '${{ inputs.version }}' }
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
            echo "::error::'$VERSION' is not a semantic version such as 1.0.0 or 1.0.0-rc.1"; exit 1
          fi
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Releases are cut from main, not $GITHUB_REF"; exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$VERSION" >/dev/null; then
            echo "::error::Tag v$VERSION already exists; releases are never overwritten"; exit 1
          fi

  # The whole CI pipeline (tests, static analysis, e2e, scans) must pass for the exact commit being released.
  ci:
    needs: validate
    uses: ./.github/workflows/ci.yml

  publish:
    needs: [validate, ci]
    runs-on: ubuntu-24.04
    # Add required reviewers to this environment (Settings → Environments → release) for a two-person release.
    environment: release
    permissions:
      contents: write   # tag and GitHub release
      packages: write   # push to ghcr.io
      id-token: write   # keyless signing
    env:
      VERSION: '${{ inputs.version }}'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Image names
        run: |
          owner="${GITHUB_REPOSITORY_OWNER,,}"
          echo "BACKEND=ghcr.io/$owner/cas-backend" >> "$GITHUB_ENV"
          echo "FRONTEND=ghcr.io/$owner/cas-frontend" >> "$GITHUB_ENV"
      - name: Build the images
        run: |
          for app in backend frontend; do
            image=$([ "$app" = backend ] && echo "$BACKEND" || echo "$FRONTEND")
            docker build "$app" -t "$image:$VERSION" -t "$image:sha-${GITHUB_SHA::12}" \
              --label "org.opencontainers.image.version=$VERSION" --label "org.opencontainers.image.revision=$GITHUB_SHA" \
              --label "org.opencontainers.image.source=$GITHUB_SERVER_URL/$GITHUB_REPOSITORY"
          done
      - name: Scan the backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: '${{ env.BACKEND }}:${{ env.VERSION }}', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
      - name: Scan the frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: '${{ env.FRONTEND }}:${{ env.VERSION }}', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
      - name: Backend SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: '${{ env.BACKEND }}:${{ env.VERSION }}', format: cyclonedx, output: 'cas-backend-${{ env.VERSION }}.cdx.json' }
      - name: Frontend SBOM
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: '${{ env.FRONTEND }}:${{ env.VERSION }}', format: cyclonedx, output: 'cas-frontend-${{ env.VERSION }}.cdx.json' }
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with: { registry: ghcr.io, username: '${{ github.actor }}', password: '${{ secrets.GITHUB_TOKEN }}' }
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
      - name: Push and sign
        run: |
          for image in "$BACKEND" "$FRONTEND"; do
            docker push "$image:$VERSION"
            docker push "$image:sha-${GITHUB_SHA::12}"
            digest=$(docker inspect --format '{{index .RepoDigests 0}}' "$image:$VERSION")
            cosign sign --yes "$digest"
            echo "$image:$VERSION → $digest" >> digests.txt
          done
      - name: Tag and publish the release
        env: { GH_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
        run: |
          pre=""; [[ "$VERSION" == *-* ]] && pre="--prerelease"
          {
            echo "Images (signed with cosign, keyless; verify with \`cosign verify\`):"
            echo '```'; cat digests.txt; echo '```'
          } > notes.md
          gh release create "v$VERSION" --target "$GITHUB_SHA" --title "AVTECH CAS $VERSION" --generate-notes --notes-file notes.md $pre \
            "cas-backend-$VERSION.cdx.json" "cas-frontend-$VERSION.cdx.json" digests.txt
