name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Lets CI be started by hand (Actions tab or `gh workflow run CI`) without a new commit.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: backend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      # Integration tests start PostgreSQL through Testcontainers (Docker is available on the runner).
      # `verify` also runs SpotBugs with the FindSecBugs rules and fails on any finding not reviewed in spotbugs-exclude.xml.
      - run: ./mvnw -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: backend-test-reports
          path: |
            backend/target/surefire-reports
            backend/target/spotbugsXml.xml

  frontend:
    runs-on: ubuntu-24.04
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npm audit --omit=dev --audit-level=high

  # End-to-end tests (Playwright) against the real stack: the backend jar with the dev profile (placeholder seed data)
  # on an empty PostgreSQL, and the Vite dev server proxying /api. The bootstrap administrator is enrolled by
  # scripts/e2e-bootstrap.mjs; every credential is generated for the run and masked.
  e2e:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    timeout-minutes: 60
    services:
      postgres:
        image: postgres:17-alpine
        env: { POSTGRES_DB: cas, POSTGRES_USER: cas, POSTGRES_PASSWORD: ci-only-not-a-secret }
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U cas" --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17', cache: maven }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - name: Build the backend
        working-directory: backend
        run: ./mvnw -B -q package -DskipTests
      - name: Generate run-only secrets
        run: |
          mkdir -p .secrets
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:3072 -out .secrets/jwt_private.pem
          openssl pkey -in .secrets/jwt_private.pem -pubout -out .secrets/jwt_public.pem
          key=$(openssl rand -base64 32); temp="Boot-$(openssl rand -hex 8)-Aa1!"
          echo "::add-mask::$key"; echo "::add-mask::$temp"
          { echo "CAS_DATA_ENCRYPTION_KEY=$key"; echo "BOOTSTRAP_PASSWORD=$temp"; } >> "$GITHUB_ENV"
      - name: Start the backend
        env:
          SPRING_PROFILES_ACTIVE: dev
          CAS_DB_URL: jdbc:postgresql://localhost:5432/cas
          CAS_DB_USER: cas
          CAS_DB_PASSWORD: ci-only-not-a-secret
          CAS_COOKIE_SECURE: 'false'
          CAS_BOOTSTRAP_ADMIN_USERNAME: e2e.admin
          CAS_BOOTSTRAP_ADMIN_EMAIL: e2e.admin@ci.invalid
        run: |
          export CAS_JWT_PRIVATE_KEY_PATH="$PWD/.secrets/jwt_private.pem" CAS_JWT_PUBLIC_KEY_PATH="$PWD/.secrets/jwt_public.pem"
          export CAS_BOOTSTRAP_ADMIN_PASSWORD="$BOOTSTRAP_PASSWORD"
          nohup java -jar backend/target/cas-backend-0.1.0-SNAPSHOT.jar > backend.log 2>&1 &
          for i in $(seq 1 90); do curl -sf http://127.0.0.1:8080/actuator/health | grep -q UP && exit 0; sleep 2; done
          tail -100 backend.log; exit 1
      - name: Enrol the e2e administrator
        run: node scripts/e2e-bootstrap.mjs http://127.0.0.1:8080 e2e.admin "$BOOTSTRAP_PASSWORD"
      - name: Start the frontend
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
          nohup npx vite --port 5174 --strictPort > ../vite.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:5174/ > /dev/null && exit 0; sleep 1; done
          cat ../vite.log; exit 1
      - name: Playwright
        working-directory: frontend
        env: { E2E_API_URL: 'http://127.0.0.1:8080', E2E_BASE_URL: 'http://localhost:5174' }
        run: npx playwright test --workers=1 --reporter=line,html
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: e2e-results
          path: |
            frontend/playwright-report
            frontend/test-results
            backend.log
            vite.log

  security-scan:
    runs-on: ubuntu-24.04
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env: { GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}' }
      - name: Dependency and filesystem vulnerability scan
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { scan-type: fs, scan-ref: ., severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }

  images:
    runs-on: ubuntu-24.04
    needs: [security-scan, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t cas-backend:${{ github.sha }} backend
      - run: docker build -t cas-frontend:${{ github.sha }} frontend
      - name: Scan backend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: 'cas-backend:${{ github.sha }}', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
      - name: Scan frontend image
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with: { image-ref: 'cas-frontend:${{ github.sha }}', severity: 'HIGH,CRITICAL', exit-code: '1', ignore-unfixed: true }
      # Deployment to staging/production is a separate, approval-gated workflow (Phase 5),
      # pushing signed images to the approved PH-resident registry.
