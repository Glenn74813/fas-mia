cas:
  access:
    # Most tests create users with financial roles directly; GrantApprovalIT switches the maker-checker on.
    financial-grant-approval: false
  budget:
    enforcement: "OFF"
  fixed-assets:
    # RemeasurementIT revalues assets; production keeps revaluation off until AVTECH adopts the model (C-07, C-30).
    revaluation-enabled: true
  accounting:
    allow-placeholder-accounts: true
    recurring-enabled: false
  jwt:
    allow-ephemeral-keys: true
  rate-limit:
    enabled: false
  outbox:
    dispatch-enabled: false
  mfa:
    email-otp:
      enabled: true
  # Tests run anomaly detection themselves.
  anomalies:
    enabled: false
  webhooks:
    # Tests dispatch webhooks themselves, to a receiver on localhost.
    poll-interval: P1D
    allow-local-targets: true
  exports:
    # Tests build data exports themselves (DataExportService.processPending).
    poll-interval: P1D
  reports:
    # Tests run report jobs themselves (ReportJobService.processPending); a background poll could claim a job
    # first and leave it RUNNING when the test checks it.
    poll-interval: P1D
spring:
  flyway:
    clean-disabled: false
