cas:
  access:
    # Most tests create users with financial roles directly; GrantApprovalIT switches the maker-checker on.
    financial-grant-approval: false
  budget:
    enforcement: "OFF"
  accounting:
    allow-placeholder-accounts: true
    recurring-enabled: false
  jwt:
    allow-ephemeral-keys: true
  rate-limit:
    enabled: false
  outbox:
    dispatch-enabled: false
  mfa:
    email-otp:
      enabled: true
  reports:
    # Tests run report jobs themselves (ReportJobService.processPending); a background poll could claim a job
    # first and leave it RUNNING when the test checks it.
    poll-interval: P1D
spring:
  flyway:
    clean-disabled: false
