# Reference edge configuration (TLS termination) for staging/production. Certificates and the
# upstream address are environment-specific. A managed WAF should sit in front of this tier.
upstream cas_web { server cas-frontend:8080; keepalive 16; }

limit_req_zone $binary_remote_addr zone=cas_auth:10m rate=30r/m;

server {
    listen 443 ssl;
    http2 on;
    server_name cas.example.invalid;            # replace with the approved hostname
    ssl_certificate     /etc/nginx/tls/fullchain.pem;
    ssl_certificate_key /etc/nginx/tls/privkey.pem;
    ssl_protocols TLSv1.3;                      # add TLSv1.2 only for documented legacy integrations
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 10m;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    location /api/v1/auth/ {
        limit_req zone=cas_auth burst=10 nodelay;
        proxy_pass http://cas_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }
    location / {
        proxy_pass http://cas_web;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Request-Id $request_id;
    }
}

server {
    listen 80;
    server_name cas.example.invalid;
    return 301 https://$host$request_uri;
}
