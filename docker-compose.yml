# Local development stack. Not a production deployment: secrets come from .env (see .env.example).
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: cas
      POSTGRES_USER: ${CAS_DB_USER:-cas}
      POSTGRES_PASSWORD: ${CAS_DB_PASSWORD:?set CAS_DB_PASSWORD in .env}
    ports: ["127.0.0.1:5432:5432"]
    volumes: [cas-db:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d cas"]
      interval: 5s
      retries: 10

  backend:
    build: ./backend
    depends_on:
      db: { condition: service_healthy }
    environment:
      SPRING_PROFILES_ACTIVE: ${SPRING_PROFILES_ACTIVE:-dev}
      CAS_DB_URL: jdbc:postgresql://db:5432/cas
      CAS_DB_USER: ${CAS_DB_USER:-cas}
      CAS_DB_PASSWORD: ${CAS_DB_PASSWORD}
      CAS_DATA_ENCRYPTION_KEY: ${CAS_DATA_ENCRYPTION_KEY:?run scripts/dev-secrets.sh}
      CAS_JWT_PRIVATE_KEY_PATH: /run/secrets/jwt_private.pem
      CAS_JWT_PUBLIC_KEY_PATH: /run/secrets/jwt_public.pem
      CAS_FRONTEND_BASE_URL: http://localhost:8088
      CAS_COOKIE_SECURE: "false"
      CAS_MANAGEMENT_PORT: "8081"
      CAS_BOOTSTRAP_ADMIN_USERNAME: ${CAS_BOOTSTRAP_ADMIN_USERNAME:-}
      CAS_BOOTSTRAP_ADMIN_EMAIL: ${CAS_BOOTSTRAP_ADMIN_EMAIL:-}
      CAS_BOOTSTRAP_ADMIN_PASSWORD: ${CAS_BOOTSTRAP_ADMIN_PASSWORD:-}
    volumes:
      - ./.secrets/jwt_private.pem:/run/secrets/jwt_private.pem:ro
      - ./.secrets/jwt_public.pem:/run/secrets/jwt_public.pem:ro
    ports: ["127.0.0.1:8080:8080"]

  frontend:
    build: ./frontend
    depends_on: [backend]
    ports: ["127.0.0.1:8088:8080"]

volumes:
  cas-db:
